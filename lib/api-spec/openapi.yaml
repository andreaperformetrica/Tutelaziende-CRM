        - sesso
        - dataNascita
        - luogoNascitaCodice
        - luogoNascitaNome
        - luogoNascitaProvincia
        - luogoNascitaEstero
        - nazionalita
        - nazionalitaNome
        - straniero
        - codiceFiscale
        - email
        - telefono
        - cellulare
        - numeroSportello
        - tipologia
        - capogruppoId
        - capogruppoNome
        - numeroCollaboratori
        - attivo
        - deveCambiarePassword
        - ultimoAccesso
        - creatoIl
      properties:
        id:
          type: integer
        utenteId:
          type: integer
        nome:
          type: string
        cognome:
          type: string
        sesso:
          $ref: "#/components/schemas/Sesso"
        dataNascita:
          type: string
          description: AAAA-MM-GG
        luogoNascitaCodice:
          type: string
        luogoNascitaNome:
          type: string
        luogoNascitaProvincia:
          type: ["string", "null"]
        luogoNascitaEstero:
          type: boolean
        nazionalita:
          type: string
          description: IT oppure codice dello stato estero
        nazionalitaNome:
          type: string
        straniero:
          type: boolean
          description: Vero se la nazionalita non e' italiana
        codiceFiscale:
          type: string
        partitaIva:
          type: ["string", "null"]
          description: Facoltativa, 11 cifre
        email:
