openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Accesso e sessione
  - name: utenti
    description: Utenti interni del back office
  - name: collaboratori
    description: Anagrafica collaboratori (sedi) e gruppi
  - name: luoghi
    description: Comuni italiani, stati esteri e nazionalita
  - name: assistiti
    description: Anagrafica degli assistiti
  - name: segnalazioni
    description: Segnalazioni di assistiti gia' registrati (solo back office)
  - name: configurazione
    description: Configurazione delle pratiche (tipi, documenti, moduli, mandati, stati, orari). Solo admin e super admin
  - name: pratiche
    description: Apertura e invio delle pratiche dal Web Collaboratore
  - name: gestione-pratiche
    description: Gestione delle pratiche nel back office (elenco, scheda, presa in carico, stati, commenti)
  - name: log
    description: Log delle operazioni
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Accesso con email e password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Accesso eseguito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessioneUtente"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Esce dalla sessione corrente
      responses:
        "204":
          description: Sessione chiusa
  /auth/me:
    get:
      operationId: getSessione
      tags: [auth]
      summary: Utente della sessione corrente
      responses:
        "200":
          description: Utente autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessioneUtente"
  /auth/cambio-password:
    post:
      operationId: cambiaPassword
      tags: [auth]
      summary: Cambia la password dell'utente corrente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioPasswordInput"
      responses:
        "200":
          description: Password cambiata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessioneUtente"

  /utenti:
    get:
      operationId: listUtenti
      tags: [utenti]
      summary: Elenco utenti interni
      responses:
        "200":
          description: Utenti interni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utente"
    post:
      operationId: createUtente
      tags: [utenti]
      summary: Crea un utente interno con password provvisoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteInput"
      responses:
        "201":
          description: Utente creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
  /utenti/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getUtente
      tags: [utenti]
      summary: Dettaglio utente interno
      responses:
        "200":
          description: Utente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
    put:
      operationId: updateUtente
      tags: [utenti]
      summary: Modifica un utente interno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteUpdate"
      responses:
        "200":
          description: Utente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
  /utenti/{id}/password-provvisoria:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: impostaPasswordProvvisoriaUtente
      tags: [utenti]
      summary: Imposta una nuova password provvisoria (da cambiare al primo accesso)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordProvvisoriaInput"
      responses:
        "200":
          description: Password provvisoria impostata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"

  /collaboratori:
    get:
      operationId: listCollaboratori
      tags: [collaboratori]
      summary: Elenco collaboratori
      parameters:
        - name: q
          in: query
          required: false
          description: Ricerca su nome, cognome, codice fiscale, cellulare, email, numero di sportello
          schema:
            type: string
        - name: tipologia
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Tipologia"
        - name: capogruppoId
          in: query
          required: false
          description: Solo i collaboratori del gruppo di questo capogruppo
          schema:
            type: integer
        - name: stato
          in: query
          required: false
          schema:
            type: string
            enum: [attivi, disattivati, tutti]
      responses:
        "200":
          description: Collaboratori
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collaboratore"
    post:
      operationId: createCollaboratore
      tags: [collaboratori]
      summary: Crea un collaboratore e il suo accesso con password provvisoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaboratoreInput"
      responses:
        "201":
          description: Collaboratore creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratoreDettaglio"
  /collaboratori/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getCollaboratore
      tags: [collaboratori]
      summary: Scheda collaboratore, con i collaboratori del suo gruppo se e' capogruppo
      responses:
        "200":
          description: Collaboratore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratoreDettaglio"
    put:
      operationId: updateCollaboratore
      tags: [collaboratori]
      summary: Modifica un collaboratore (anagrafica, sportello, capogruppo, attivo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaboratoreUpdate"
      responses:
        "200":
          description: Collaboratore aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratoreDettaglio"
  /collaboratori/{id}/password-provvisoria:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: impostaPasswordProvvisoriaCollaboratore
      tags: [collaboratori]
      summary: Imposta una nuova password provvisoria (da cambiare al primo accesso)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordProvvisoriaInput"
      responses:
        "200":
          description: Password provvisoria impostata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratoreDettaglio"

  /assistiti:
    get:
      operationId: listAssistiti
      tags: [assistiti]
      summary: Elenco assistiti visibili all'utente (propri, del gruppo se capogruppo, tutti per il back office)
      parameters:
        - name: q
          in: query
          required: false
          description: "Ricerca su nome, cognome e codice fiscale (con piu parole devono corrispondere tutte)"
          schema:
            type: string
        - name: collaboratoreId
          in: query
          required: false
          description: Solo gli assistiti di questo collaboratore
          schema:
            type: integer
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Pagina di assistiti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistitiPagina"
    post:
      operationId: createAssistito
      tags: [assistiti]
      summary: Crea un assistito (solo collaboratori, per se stessi)
      description: >
        Se il codice fiscale o il cellulare corrispondono a una persona gia' registrata e non visibile al
        collaboratore risponde 409 con codice ASSISTITO_GIA_PRESENTE senza rivelare chi sia e crea una
        segnalazione per il back office. Se l'assistito e' gia' tra quelli visibili al collaboratore risponde
        409 con codice ASSISTITO_GIA_NEI_TUOI_ELENCHI e l'id dell'assistito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistitoInput"
      responses:
        "201":
          description: Assistito creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistito"
  /assistiti/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getAssistito
      tags: [assistiti]
      summary: Scheda assistito
      responses:
        "200":
          description: Assistito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistito"
    put:
      operationId: updateAssistito
      tags: [assistiti]
      summary: Modifica un proprio assistito (solo il collaboratore a cui e' associato)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistitoInput"
      responses:
        "200":
          description: Assistito aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistito"
  /assistiti/{id}/collaboratore:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: associaAssistitoACollaboratore
      tags: [assistiti]
      summary: Associa l'assistito a un altro collaboratore (admin e super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociaCollaboratoreInput"
      responses:
        "200":
          description: Assistito riassegnato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistito"
  /segnalazioni-duplicati:
    get:
      operationId: listSegnalazioniDuplicati
      tags: [segnalazioni]
      summary: Segnalazioni di assistiti gia' registrati (admin e super admin)
      parameters:
        - name: stato
          in: query
          required: false
          schema:
            type: string
            enum: [aperte, gestite, tutte]
      responses:
        "200":
          description: Segnalazioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SegnalazioneDuplicato"
  /segnalazioni-duplicati/conteggio:
    get:
      operationId: getConteggioSegnalazioni
      tags: [segnalazioni]
      summary: Numero di segnalazioni aperte (admin e super admin)
      responses:
        "200":
          description: Conteggio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConteggioSegnalazioni"
  /segnalazioni-duplicati/{id}/associa:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: associaSegnalazione
      tags: [segnalazioni]
      summary: Associa l'assistito gia' registrato a un collaboratore e chiude la segnalazione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociaSegnalazioneInput"
      responses:
        "200":
          description: Segnalazione gestita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegnalazioneDuplicato"
  /segnalazioni-duplicati/{id}/archivia:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: archiviaSegnalazione
      tags: [segnalazioni]
      summary: Chiude la segnalazione senza modificare le associazioni
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiviaSegnalazioneInput"
      responses:
        "200":
          description: Segnalazione archiviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegnalazioneDuplicato"

  /luoghi:
    get:
      operationId: cercaLuoghi
      tags: [luoghi]
      summary: Cerca comuni italiani e stati esteri (luogo di nascita)
      parameters:
        - name: q
          in: query
          required: true
          description: Almeno 2 caratteri
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [comune, stato]
      responses:
        "200":
          description: Luoghi trovati (massimo 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Luogo"
  /nazionalita:
    get:
      operationId: listNazionalita
      tags: [luoghi]
      summary: Elenco delle nazionalita selezionabili
      responses:
        "200":
          description: Nazionalita (Italia per prima)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nazionalita"

  /log-operazioni:
    get:
      operationId: listLogOperazioni
      tags: [log]
      summary: Log delle operazioni, dal piu recente
      parameters:
        - name: utenteId
          in: query
          required: false
          schema:
            type: integer
        - name: da
          in: query
          required: false
          description: Data iniziale (AAAA-MM-GG, fuso Europe/Rome), inclusa
          schema:
            type: string
        - name: a
          in: query
          required: false
          description: Data finale (AAAA-MM-GG, fuso Europe/Rome), inclusa
          schema:
            type: string
        - name: azione
          in: query
          required: false
          schema:
            type: string
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Pagina di log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogOperazioniPagina"
  /log-operazioni/filtri:
    get:
      operationId: getFiltriLog
      tags: [log]
      summary: Valori selezionabili nei filtri del log
      responses:
        "200":
          description: Utenti presenti nel log e tipi di azione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiltriLog"
  # I caricamenti di file non sono nella specifica (corpo binario): POST /mandati/file, PUT /mandati/{id}/file, POST /tipi-pratica/{id}/moduli/file,
  # PUT /moduli-tipo/{id}/file, e i download GET /moduli-tipo/{id}/file e GET /mandati/{id}/file.
  /tipi-pratica:
    get:
      operationId: listTipiPratica
      tags: [configurazione]
      summary: Elenco dei tipi di pratica con documenti e moduli
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipoPratica"
    post:
      operationId: createTipoPratica
      tags: [configurazione]
      summary: Crea un tipo di pratica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TipoPraticaInput"
      responses:
        "201":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
  /tipi-pratica/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getTipoPratica
      tags: [configurazione]
      summary: Dettaglio di un tipo di pratica
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
    put:
      operationId: updateTipoPratica
      tags: [configurazione]
      summary: Modifica un tipo di pratica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TipoPraticaInput"
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
  /tipi-pratica/{id}/documenti:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: createDocumentoTipo
      tags: [configurazione]
      summary: Aggiunge un documento obbligatorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentoTipoInput"
      responses:
        "201":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
  /tipi-pratica/{id}/documenti-ordine:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: ordinaDocumentiTipo
      tags: [configurazione]
      summary: Riordina i documenti obbligatori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrdineInput"
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
  /documenti-tipo/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: updateDocumentoTipo
      tags: [configurazione]
      summary: Modifica un documento obbligatorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentoTipoInput"
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
    delete:
      operationId: deleteDocumentoTipo
      tags: [configurazione]
      summary: Elimina un documento obbligatorio
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
  /moduli-tipo/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: renameModuloTipo
      tags: [configurazione]
      summary: Rinomina un modulo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuloTipoInput"
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
    delete:
      operationId: deleteModuloTipo
      tags: [configurazione]
      summary: Elimina un modulo e il suo file
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoPratica"
  /mandati:
    get:
      operationId: listMandati
      tags: [configurazione]
      summary: Raccolta dei mandati (tutti, o di un tipo di pratica)
      parameters:
        - name: tipoPraticaId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mandato"
  /mandati/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: rinominaMandato
      tags: [configurazione]
      summary: Rinomina un mandato della raccolta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandatoInput"
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandato"
    delete:
      operationId: deleteMandato
      tags: [configurazione]
      summary: Elimina un mandato non assegnato a nessun collaboratore
      responses:
        "204":
          description: Eseguito
  /assegnazioni-mandato:
    get:
      operationId: listAssegnazioniMandato
      tags: [configurazione]
      summary: Mandato assegnato a ogni collaboratore, per tipo di pratica
      parameters:
        - name: tipoPraticaId
          in: query
          required: false
          schema:
            type: integer
        - name: collaboratoreId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssegnazioneMandato"
    put:
      operationId: assegnaMandato
      tags: [configurazione]
      summary: Assegna (o cambia) il mandato di un collaboratore per un tipo di pratica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssegnazioneMandatoInput"
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssegnazioneMandato"
    delete:
      operationId: rimuoviAssegnazioneMandato
      tags: [configurazione]
      summary: Toglie il mandato assegnato a un collaboratore per un tipo di pratica
      parameters:
        - name: tipoPraticaId
          in: query
          required: true
          schema:
            type: integer
        - name: collaboratoreId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eseguito
  # Upload raw (non nella specifica): POST /pratiche/{id}/documenti/file (query nomeFile, documentoTipoId opzionale, nome opzionale);
  # download: GET /pratiche/{id}/documenti/{docId}/file e GET /pratiche/{id}/mandato/file.
  /pratiche:
    get:
      operationId: listPratiche
      tags: [pratiche]
      summary: Le mie pratiche (e quelle del gruppo, se capogruppo)
      parameters:
        - name: q
          in: query
          required: false
          description: Ricerca su nome, cognome e codice fiscale dell'assistito o sul numero pratica
          schema:
            type: string
        - name: collaboratoreId
          in: query
          required: false
          description: Solo le pratiche di questo collaboratore del gruppo
          schema:
            type: integer
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Pagina di pratiche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PratichePagina"
    post:
      operationId: createPratica
      tags: [pratiche]
      summary: Apre una pratica in bozza per un proprio assistito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PraticaInput"
      responses:
        "201":
          description: Pratica in bozza
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PraticaDettaglio"
  /pratiche/stato-invio:
