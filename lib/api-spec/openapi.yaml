components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErroreApi:
      type: object
      description: Formato degli errori (400, 401, 403, 404, 409, 429). Il messaggio e' in italiano.
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: >
            Codice stabile, ad esempio PASSWORD_DA_CAMBIARE, CODICE_FISCALE_DUPLICATO,
            CELLULARE_DUPLICATO, EMAIL_DUPLICATA, SPORTELLO_DUPLICATO.
        campo:
          type: string
          description: Nome del campo del modulo a cui si riferisce l'errore
        assistitoId:
          type: integer
          description: Solo per ASSISTITO_GIA_NEI_TUOI_ELENCHI, id dell'assistito gia' presente tra quelli visibili

    Ruolo:
      type: string
      enum: [super_admin, admin, operatore, collaboratore]
    RuoloInterno:
      type: string
      enum: [super_admin, admin, operatore]
    Tipologia:
      type: string
      enum: [CAF, PATRONATO]
    Sesso:
      type: string
      enum: [M, F]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CambioPasswordInput:
      type: object
      required: [passwordAttuale, nuovaPassword]
      properties:
        passwordAttuale:
          type: string
        nuovaPassword:
          type: string
          minLength: 8
    PasswordProvvisoriaInput:
      type: object
      required: [passwordProvvisoria]
      properties:
        passwordProvvisoria:
          type: string
          minLength: 8

    SessioneCollaboratore:
      type: object
      required: [id, numeroSportello, tipologia, capogruppo]
      properties:
        id:
          type: integer
        numeroSportello:
          type: string
        tipologia:
          $ref: "#/components/schemas/Tipologia"
        capogruppo:
          type: boolean
          description: Vero se ha collaboratori nel proprio gruppo
    SessioneUtente:
      type: object
      required: [id, email, nome, cognome, ruolo, area, deveCambiarePassword, collaboratore, colore]
      properties:
        id:
          type: integer
        email:
          type: string
        nome:
          type: string
        cognome:
          type: string
        colore:
          type: ["string", "null"]
          description: Colore scelto per l'utente interno (#rrggbb); null se non scelto
        ruolo:
          $ref: "#/components/schemas/Ruolo"
        area:
          type: string
          enum: [backoffice, collaboratore]
          description: Area in cui l'utente deve essere portato dopo il login
        deveCambiarePassword:
          type: boolean
          description: Se vero, finche' non cambia la password ogni altra chiamata risponde 403 con code PASSWORD_DA_CAMBIARE
        collaboratore:
          oneOf:
            - $ref: "#/components/schemas/SessioneCollaboratore"
            - type: "null"

    Utente:
      type: object
      required: [id, email, nome, cognome, ruolo, attivo, deveCambiarePassword, ultimoAccesso, creatoIl, colore]
      properties:
        id:
          type: integer
        email:
          type: string
        nome:
          type: string
        cognome:
          type: string
        colore:
          type: ["string", "null"]
          description: Colore scelto (#rrggbb); null = colore automatico
        ruolo:
          $ref: "#/components/schemas/RuoloInterno"
        attivo:
          type: boolean
        deveCambiarePassword:
          type: boolean
        ultimoAccesso:
          type: ["string", "null"]
          description: Istante ISO 8601
        creatoIl:
          type: string
          description: Istante ISO 8601
    UtenteInput:
      type: object
      required: [email, nome, cognome, ruolo, passwordProvvisoria]
      properties:
        email:
          type: string
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        ruolo:
          $ref: "#/components/schemas/RuoloInterno"
        colore:
          type: ["string", "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
        passwordProvvisoria:
          type: string
          minLength: 8
    UtenteUpdate:
      type: object
      required: [email, nome, cognome, ruolo, attivo]
      properties:
        email:
          type: string
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        ruolo:
          $ref: "#/components/schemas/RuoloInterno"
        attivo:
          type: boolean
        colore:
          type: ["string", "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Se omesso resta invariato; null riporta al colore automatico

    Luogo:
      type: object
      required: [codice, nome, provincia, tipo, attuale]
      properties:
        codice:
          type: string
          description: Codice catastale (Belfiore) del comune (es. H501) o dello stato estero (es. Z129)
        nome:
          type: string
        provincia:
          type: ["string", "null"]
          description: Sigla della provincia, null per gli stati esteri
        tipo:
          type: string
          enum: [comune, stato]
        attuale:
          type: boolean
          description: Falso per comuni soppressi e stati non piu esistenti
    Nazionalita:
      type: object
      required: [codice, nome]
      properties:
        codice:
          type: string
          description: IT per l'Italia, altrimenti il codice dello stato estero (es. Z129)
        nome:
          type: string

    CollaboratoreRiepilogo:
      type: object
      required: [id, nome, cognome, numeroSportello, tipologia, attivo]
      properties:
        id:
          type: integer
        nome:
          type: string
        cognome:
          type: string
        numeroSportello:
          type: string
        tipologia:
          $ref: "#/components/schemas/Tipologia"
        attivo:
          type: boolean
    Collaboratore:
      type: object
      required:
