openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Accesso e sessione
  - name: utenti
    description: Utenti interni del back office
  - name: collaboratori
    description: Anagrafica collaboratori (sedi) e gruppi
  - name: luoghi
    description: Comuni italiani, stati esteri e nazionalita
  - name: assistiti
    description: Anagrafica degli assistiti
  - name: segnalazioni
    description: Segnalazioni di assistiti gia' registrati (solo back office)
  - name: configurazione
    description: Configurazione delle pratiche (tipi, documenti, moduli, mandati, stati, orari). Solo admin e super admin
  - name: pratiche
    description: Apertura e invio delle pratiche dal Web Collaboratore
  - name: gestione-pratiche
    description: Gestione delle pratiche nel back office (elenco, scheda, presa in carico, stati, commenti)
  - name: log
    description: Log delle operazioni
  - name: eventi-backoffice
    description: Eventi e corsi di formazione nel back office (solo admin e super admin)
  - name: eventi
    description: Eventi e corsi di formazione nel Web Collaboratore
  - name: notifiche
    description: Registro delle notifiche email e WhatsApp. Solo admin e super admin
  - name: compensi
    description: Compensi ai collaboratori (resoconto, estratti, pagamenti, dare/avere). Solo admin e super admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Accesso con email e password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Accesso eseguito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessioneUtente"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Esce dalla sessione corrente
      responses:
        "204":
          description: Sessione chiusa
  /auth/me:
    get:
      operationId: getSessione
      tags: [auth]
      summary: Utente della sessione corrente
      responses:
        "200":
          description: Utente autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessioneUtente"
  /auth/cambio-password:
    post:
      operationId: cambiaPassword
      tags: [auth]
      summary: Cambia la password dell'utente corrente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioPasswordInput"
      responses:
        "200":
          description: Password cambiata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessioneUtente"

  /utenti:
    get:
      operationId: listUtenti
      tags: [utenti]
      summary: Elenco utenti interni
      responses:
        "200":
          description: Utenti interni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utente"
    post:
      operationId: createUtente
      tags: [utenti]
      summary: Crea un utente interno con password provvisoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteInput"
      responses:
        "201":
          description: Utente creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
  /utenti/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getUtente
      tags: [utenti]
      summary: Dettaglio utente interno
      responses:
        "200":
          description: Utente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
    put:
      operationId: updateUtente
      tags: [utenti]
      summary: Modifica un utente interno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteUpdate"
      responses:
        "200":
          description: Utente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
  /utenti/{id}/password-provvisoria:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: impostaPasswordProvvisoriaUtente
      tags: [utenti]
      summary: Imposta una nuova password provvisoria (da cambiare al primo accesso)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordProvvisoriaInput"
      responses:
        "200":
          description: Password provvisoria impostata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"

  /collaboratori:
    get:
      operationId: listCollaboratori
      tags: [collaboratori]
      summary: Elenco collaboratori
      parameters:
        - name: q
          in: query
          required: false
          description: Ricerca su nome, cognome, codice fiscale, cellulare, email, numero di sportello
          schema:
            type: string
        - name: tipologia
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Tipologia"
        - name: capogruppoId
          in: query
          required: false
          description: Solo i collaboratori del gruppo di questo capogruppo
          schema:
            type: integer
        - name: stato
          in: query
          required: false
          schema:
            type: string
            enum: [attivi, disattivati, tutti]
      responses:
        "200":
          description: Collaboratori
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collaboratore"
    post:
      operationId: createCollaboratore
      tags: [collaboratori]
      summary: Crea un collaboratore e il suo accesso con password provvisoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaboratoreInput"
      responses:
        "201":
          description: Collaboratore creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratoreDettaglio"
  /collaboratori/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getCollaboratore
      tags: [collaboratori]
      summary: Scheda collaboratore, con i collaboratori del suo gruppo se e' capogruppo
      responses:
        "200":
          description: Collaboratore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratoreDettaglio"
    put:
      operationId: updateCollaboratore
      tags: [collaboratori]
      summary: Modifica un collaboratore (anagrafica, sportello, capogruppo, attivo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaboratoreUpdate"
      responses:
        "200":
          description: Collaboratore aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratoreDettaglio"
  /collaboratori/{id}/password-provvisoria:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: impostaPasswordProvvisoriaCollaboratore
      tags: [collaboratori]
      summary: Imposta una nuova password provvisoria (da cambiare al primo accesso)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordProvvisoriaInput"
      responses:
        "200":
          description: Password provvisoria impostata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratoreDettaglio"

  /assistiti:
    get:
      operationId: listAssistiti
      tags: [assistiti]
      summary: Elenco assistiti visibili all'utente (propri, del gruppo se capogruppo, tutti per il back office)
      parameters:
        - name: q
          in: query
          required: false
          description: "Ricerca su nome, cognome e codice fiscale (con piu parole devono corrispondere tutte)"
          schema:
            type: string
        - name: collaboratoreId
          in: query
          required: false
          description: Solo gli assistiti di questo collaboratore
          schema:
            type: integer
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Pagina di assistiti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistitiPagina"
    post:
      operationId: createAssistito
      tags: [assistiti]
      summary: Crea un assistito (solo collaboratori, per se stessi)
      description: >
        Se il codice fiscale o il cellulare corrispondono a una persona gia' registrata e non visibile al
        collaboratore risponde 409 con codice ASSISTITO_GIA_PRESENTE senza rivelare chi sia e crea una
        segnalazione per il back office. Se l'assistito e' gia' tra quelli visibili al collaboratore risponde
        409 con codice ASSISTITO_GIA_NEI_TUOI_ELENCHI e l'id dell'assistito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistitoInput"
      responses:
        "201":
          description: Assistito creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistito"
  /assistiti/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getAssistito
      tags: [assistiti]
      summary: Scheda assistito
      responses:
        "200":
          description: Assistito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistito"
    put:
      operationId: updateAssistito
      tags: [assistiti]
      summary: Modifica un proprio assistito (solo il collaboratore a cui e' associato)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistitoInput"
      responses:
        "200":
          description: Assistito aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistito"
  /assistiti/{id}/collaboratore:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: associaAssistitoACollaboratore
      tags: [assistiti]
      summary: Associa l'assistito a un altro collaboratore (admin e super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociaCollaboratoreInput"
      responses:
        "200":
          description: Assistito riassegnato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistito"
  /segnalazioni-duplicati:
    get:
      operationId: listSegnalazioniDuplicati
      tags: [segnalazioni]
      summary: Segnalazioni di assistiti gia' registrati (admin e super admin)
      parameters:
        - name: stato
          in: query
          required: false
          schema:
            type: string
            enum: [aperte, gestite, tutte]
      responses:
        "200":
          description: Segnalazioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SegnalazioneDuplicato"
  /segnalazioni-duplicati/conteggio:
    get:
      operationId: getConteggioSegnalazioni
      tags: [segnalazioni]
      summary: Numero di segnalazioni aperte (admin e super admin)
      responses:
        "200":
          description: Conteggio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConteggioSegnalazioni"
  /segnalazioni-duplicati/{id}/associa:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: associaSegnalazione
      tags: [segnalazioni]
      summary: Associa l'assistito gia' registrato a un collaboratore e chiude la segnalazione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociaSegnalazioneInput"
      responses:
        "200":
          description: Segnalazione gestita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegnalazioneDuplicato"
  /segnalazioni-duplicati/{id}/archivia:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: archiviaSegnalazione
      tags: [segnalazioni]
      summary: Chiude la segnalazione senza modificare le associazioni
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiviaSegnalazioneInput"
      responses:
        "200":
          description: Segnalazione archiviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegnalazioneDuplicato"

  /luoghi:
    get:
      operationId: cercaLuoghi
      tags: [luoghi]
      summary: Cerca comuni italiani e stati esteri (luogo di nascita)
      parameters:
        - name: q
          in: query
          required: true
          description: Almeno 2 caratteri
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [comune, stato]
      responses:
        "200":
          description: Luoghi trovati (massimo 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Luogo"
  /nazionalita:
    get:
      operationId: listNazionalita
      tags: [luoghi]
      summary: Elenco delle nazionalita selezionabili
      responses:
        "200":
          description: Nazionalita (Italia per prima)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nazionalita"

  /log-operazioni:
    get:
      operationId: listLogOperazioni
      tags: [log]
      summary: Log delle operazioni, dal piu recente
      parameters:
        - name: utenteId
          in: query
          required: false
          schema:
            type: integer
        - name: da
          in: query
          required: false
          description: Data iniziale (AAAA-MM-GG, fuso Europe/Rome), inclusa
          schema:
            type: string
        - name: a
          in: query
          required: false
          description: Data finale (AAAA-MM-GG, fuso Europe/Rome), inclusa
          schema:
            type: string
        - name: azione
          in: query
          required: false
          schema:
            type: string
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Pagina di log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogOperazioniPagina"
  /log-operazioni/filtri:
    get:
      operationId: getFiltriLog
      tags: [log]
      summary: Valori selezionabili nei filtri del log
      responses:
        "200":
          description: Utenti presenti nel log e tipi di azione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiltriLog"
  /notifiche:
    get:
      operationId: listNotifiche
      tags: [notifiche]
      summary: Registro delle notifiche, dalla piu recente
      parameters:
        - name: canale
          in: query
          required: false
          schema:
            type: string
            enum: [email, whatsapp, chiamata]
        - name: esito
          in: query
          required: false
          schema:
            type: string
            enum: [in_coda, inviata, non_inviata, errore]
        - name: evento
          in: query
          required: false
          schema:
            type: string
        - name: da
          in: query
          required: false
          description: Data iniziale (AAAA-MM-GG, fuso Europe/Rome), inclusa
          schema:
            type: string
        - name: a
          in: query
          required: false
          description: Data finale (AAAA-MM-GG, fuso Europe/Rome), inclusa
          schema:
            type: string
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Pagina del registro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifichePagina"
  /notifiche/stato:
    get:
      operationId: getStatoNotifiche
      tags: [notifiche]
      summary: Stato dei canali (invio reale attivo oppure solo registrazione) e valori dei filtri
      responses:
        "200":
          description: Stato dei canali
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatoNotifiche"
  /backoffice/eventi:
    get:
      operationId: listEventiBackoffice
      tags: [eventi-backoffice]
      summary: Elenco eventi con i conteggi di inviti, conferme, iscritti e presenti
      responses:
        "200":
          description: Eventi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoRiepilogo"
    post:
      operationId: createEvento
      tags: [eventi-backoffice]
      summary: Crea un evento e invita le sedi scelte (che ricevono la notifica)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventoCreazioneInput"
      responses:
        "201":
          description: Evento creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
  /backoffice/eventi/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getEventoBackoffice
      tags: [eventi-backoffice]
      summary: Scheda dell'evento con inviti, iscritti, orari, questionario e attestato
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
    patch:
      operationId: updateEvento
      tags: [eventi-backoffice]
      summary: Modifica i dati dell'evento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventoModificaInput"
      responses:
        "200":
          description: Evento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
    delete:
      operationId: deleteEvento
      tags: [eventi-backoffice]
      summary: Elimina un evento in cui non e' stato registrato nessun orario
      responses:
        "204":
          description: Eseguito
  /backoffice/eventi/{id}/inviti:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: addInvitiEvento
      tags: [eventi-backoffice]
      summary: Invita altre sedi (le sedi gia invitate restano com'e)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitiEventoInput"
      responses:
        "200":
          description: Evento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
  /backoffice/eventi/{id}/inviti/{collaboratoreId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: collaboratoreId
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: removeInvitoEvento
      tags: [eventi-backoffice]
      summary: Toglie l'invito a una sede senza partecipanti
      responses:
        "200":
          description: Evento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
  /backoffice/eventi/{id}/partecipanti/{partecipanteId}/orari:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: partecipanteId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateOrariPartecipante
      tags: [eventi-backoffice]
      summary: Inserisce o corregge a mano gli orari di entrata e uscita (nel giorno dell'evento)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrariPartecipanteInput"
      responses:
        "200":
          description: Evento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
  /backoffice/eventi/{id}/check-in:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: registraCheckInEvento
      tags: [eventi-backoffice]
      summary: Legge il QR code di un partecipante, la prima scansione registra l'entrata e la seconda l'uscita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "200":
          description: Esito del check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInEsito"
  /backoffice/eventi/{id}/attestato/posizione:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: updatePosizioneAttestato
      tags: [eventi-backoffice]
      summary: Imposta dove va scritto il nome del partecipante sul layout dell'attestato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosizioneAttestatoInput"
      responses:
        "200":
          description: Evento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
  /backoffice/eventi/{id}/attestato/layout:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      operationId: deleteLayoutAttestato
      tags: [eventi-backoffice]
      summary: Elimina il layout dell'attestato
      responses:
        "200":
          description: Evento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
  /backoffice/eventi/{id}/questionario:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      operationId: deleteQuestionarioEvento
      tags: [eventi-backoffice]
      summary: Elimina il questionario dell'evento
      responses:
        "200":
          description: Evento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoBackoffice"
  /eventi:
    get:
      operationId: listEventi
      tags: [eventi]
      summary: Eventi a cui la sede e' invitata
      responses:
        "200":
          description: Eventi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoSedeRiepilogo"
  /eventi/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getEvento
      tags: [eventi]
      summary: Evento, conferma della sede e suoi partecipanti con i QR code
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoSede"
  /eventi/{id}/conferma:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: confermaPartecipazioneEvento
      tags: [eventi]
      summary: Conferma la partecipazione della sede all'evento
      responses:
        "200":
