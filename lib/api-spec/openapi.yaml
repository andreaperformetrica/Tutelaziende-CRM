        - { name: tipoPraticaId, in: query, required: false, schema: { type: integer } }
        - { name: statoId, in: query, required: false, schema: { type: integer } }
        - { name: gestitaDaUtenteId, in: query, required: false, description: "Operatore che gestisce la pratica", schema: { type: integer } }
        - { name: nonAssegnate, in: query, required: false, description: "Solo le pratiche che nessuno ha preso in carico", schema: { type: boolean } }
        - { name: mese, in: query, required: false, description: "Mese della richiesta (AAAA-MM, fuso Europe/Rome)", schema: { type: string } }
        - { name: dal, in: query, required: false, description: "Data richiesta iniziale (AAAA-MM-GG), inclusa", schema: { type: string } }
        - { name: al, in: query, required: false, description: "Data richiesta finale (AAAA-MM-GG), inclusa", schema: { type: string } }
        - { name: soloLavorate, in: query, required: false, description: "Solo le pratiche gia' prese in carico da un operatore", schema: { type: boolean } }
        - { name: soloAggiornate, in: query, required: false, description: "Solo le pratiche aggiornate dal collaboratore e in attesa del back office", schema: { type: boolean } }
        - { name: aggiornatePrima, in: query, required: false, description: "Mette in cima le pratiche aggiornate", schema: { type: boolean } }
