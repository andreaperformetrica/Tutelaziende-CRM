    CollaboratorePratica:
      type: object
      required: [id, nome, cognome, numeroSportello, tipologia, email, cellulare]
      properties:
        id: { type: integer }
        nome: { type: string }
        cognome: { type: string }
        numeroSportello: { type: string }
        tipologia: { type: string }
        email: { type: [string, "null"] }
        cellulare: { type: string }
    PraticaBackoffice:
      type: object
      required:
        - id
        - numero
        - stato
        - tipo
        - assistito
        - collaboratore
        - mandato
        - documenti
        - allegatiUfficio
        - messaggio
        - commenti
        - cronologia
        - inviataIl
        - gestitaDa
        - aggiornata
        - mieInCarico
        - puoEliminare
      properties:
        id: { type: integer }
        numero: { type: integer }
        stato:
          $ref: "#/components/schemas/StatoPraticaRiepilogo"
        tipo:
          $ref: "#/components/schemas/PraticaTipoRiepilogo"
        assistito:
          $ref: "#/components/schemas/Assistito"
        collaboratore:
          $ref: "#/components/schemas/CollaboratorePratica"
        mandato:
          oneOf:
            - $ref: "#/components/schemas/MandatoPratica"
            - type: "null"
        documenti:
          type: array
          description: Documenti e allegati caricati dal collaboratore
          items:
            $ref: "#/components/schemas/DocumentoPratica"
        allegatiUfficio:
          type: array
          description: Allegati aggiunti dagli operatori
          items:
            $ref: "#/components/schemas/DocumentoPratica"
        messaggio: { type: string, description: "Messaggio iniziale scritto dal collaboratore" }
        commenti:
          type: array
          items:
            $ref: "#/components/schemas/CommentoPraticaBackoffice"
        cronologia:
          type: array
          description: Eventi della pratica, dal piu' recente
          items:
            $ref: "#/components/schemas/EventoCronologiaPratica"
        inviataIl: { type: string, format: date-time }
        gestitaDa:
          oneOf:
            - $ref: "#/components/schemas/OperatorePratica"
            - type: "null"
        aggiornata: { type: boolean }
        mieInCarico: { type: boolean, description: "La pratica e' gia' in carico all'utente che la sta guardando" }
        puoEliminare: { type: boolean, description: "Solo il super admin puo' cancellare una pratica" }
