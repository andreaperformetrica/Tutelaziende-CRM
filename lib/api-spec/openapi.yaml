components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErroreApi:
      type: object
      description: Formato degli errori (400, 401, 403, 404, 409, 429). Il messaggio e' in italiano.
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: >
            Codice stabile, ad esempio PASSWORD_DA_CAMBIARE, CODICE_FISCALE_DUPLICATO,
            CELLULARE_DUPLICATO, EMAIL_DUPLICATA, SPORTELLO_DUPLICATO.
        campo:
          type: string
          description: Nome del campo del modulo a cui si riferisce l'errore
        assistitoId:
          type: integer
          description: Solo per ASSISTITO_GIA_NEI_TUOI_ELENCHI, id dell'assistito gia' presente tra quelli visibili

    Ruolo:
      type: string
      enum: [super_admin, admin, operatore, collaboratore]
    RuoloInterno:
      type: string
      enum: [super_admin, admin, operatore]
    Tipologia:
      type: string
      enum: [CAF, PATRONATO]
    Sesso:
      type: string
      enum: [M, F]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CambioPasswordInput:
      type: object
      required: [passwordAttuale, nuovaPassword]
      properties:
        passwordAttuale:
          type: string
        nuovaPassword:
          type: string
          minLength: 8
    PasswordProvvisoriaInput:
      type: object
      required: [passwordProvvisoria]
      properties:
        passwordProvvisoria:
          type: string
          minLength: 8

    SessioneCollaboratore:
      type: object
      required: [id, numeroSportello, tipologia, capogruppo]
      properties:
        id:
          type: integer
        numeroSportello:
          type: string
        tipologia:
          $ref: "#/components/schemas/Tipologia"
        capogruppo:
          type: boolean
          description: Vero se ha collaboratori nel proprio gruppo
    SessioneUtente:
      type: object
      required: [id, email, nome, cognome, ruolo, area, deveCambiarePassword, collaboratore]
      properties:
        id:
          type: integer
        email:
          type: string
        nome:
          type: string
        cognome:
          type: string
        ruolo:
          $ref: "#/components/schemas/Ruolo"
        area:
          type: string
          enum: [backoffice, collaboratore]
          description: Area in cui l'utente deve essere portato dopo il login
        deveCambiarePassword:
          type: boolean
          description: Se vero, finche' non cambia la password ogni altra chiamata risponde 403 con code PASSWORD_DA_CAMBIARE
        collaboratore:
          oneOf:
            - $ref: "#/components/schemas/SessioneCollaboratore"
            - type: "null"

    Utente:
      type: object
      required: [id, email, nome, cognome, ruolo, attivo, deveCambiarePassword, ultimoAccesso, creatoIl]
      properties:
        id:
          type: integer
        email:
          type: string
        nome:
          type: string
        cognome:
          type: string
        ruolo:
          $ref: "#/components/schemas/RuoloInterno"
        attivo:
          type: boolean
        deveCambiarePassword:
          type: boolean
        ultimoAccesso:
          type: ["string", "null"]
          description: Istante ISO 8601
        creatoIl:
          type: string
          description: Istante ISO 8601
    UtenteInput:
      type: object
      required: [email, nome, cognome, ruolo, passwordProvvisoria]
      properties:
        email:
          type: string
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        ruolo:
          $ref: "#/components/schemas/RuoloInterno"
        passwordProvvisoria:
          type: string
          minLength: 8
    UtenteUpdate:
      type: object
      required: [email, nome, cognome, ruolo, attivo]
      properties:
        email:
          type: string
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        ruolo:
          $ref: "#/components/schemas/RuoloInterno"
        attivo:
          type: boolean

    Luogo:
      type: object
      required: [codice, nome, provincia, tipo, attuale]
      properties:
        codice:
          type: string
          description: Codice catastale (Belfiore) del comune (es. H501) o dello stato estero (es. Z129)
        nome:
          type: string
        provincia:
          type: ["string", "null"]
          description: Sigla della provincia, null per gli stati esteri
        tipo:
          type: string
          enum: [comune, stato]
        attuale:
          type: boolean
          description: Falso per comuni soppressi e stati non piu esistenti
    Nazionalita:
      type: object
      required: [codice, nome]
      properties:
        codice:
          type: string
          description: IT per l'Italia, altrimenti il codice dello stato estero (es. Z129)
        nome:
          type: string

    CollaboratoreRiepilogo:
      type: object
      required: [id, nome, cognome, numeroSportello, tipologia, attivo]
      properties:
        id:
          type: integer
        nome:
          type: string
        cognome:
          type: string
        numeroSportello:
          type: string
        tipologia:
          $ref: "#/components/schemas/Tipologia"
        attivo:
          type: boolean
    Collaboratore:
      type: object
      required:
        - id
        - utenteId
        - nome
        - cognome
        - sesso
        - dataNascita
        - luogoNascitaCodice
        - luogoNascitaNome
        - luogoNascitaProvincia
        - luogoNascitaEstero
        - nazionalita
        - nazionalitaNome
        - straniero
        - codiceFiscale
        - email
        - telefono
        - cellulare
        - numeroSportello
        - tipologia
        - capogruppoId
        - capogruppoNome
        - numeroCollaboratori
        - attivo
        - deveCambiarePassword
        - ultimoAccesso
        - creatoIl
      properties:
        id:
          type: integer
        utenteId:
          type: integer
        nome:
          type: string
        cognome:
          type: string
        sesso:
          $ref: "#/components/schemas/Sesso"
        dataNascita:
          type: string
          description: AAAA-MM-GG
        luogoNascitaCodice:
          type: string
        luogoNascitaNome:
          type: string
        luogoNascitaProvincia:
          type: ["string", "null"]
        luogoNascitaEstero:
          type: boolean
        nazionalita:
          type: string
          description: IT oppure codice dello stato estero
        nazionalitaNome:
          type: string
        straniero:
          type: boolean
          description: Vero se la nazionalita non e' italiana
        codiceFiscale:
          type: string
        email:
          type: string
        telefono:
          type: ["string", "null"]
        cellulare:
          type: string
          description: Formato internazionale, es. +393331234567
        numeroSportello:
          type: string
        tipologia:
          $ref: "#/components/schemas/Tipologia"
        capogruppoId:
          type: ["integer", "null"]
        capogruppoNome:
          type: ["string", "null"]
          description: Cognome e nome del capogruppo
        numeroCollaboratori:
          type: integer
          description: Quanti collaboratori ha nel proprio gruppo (0 se non e' capogruppo)
        attivo:
          type: boolean
        deveCambiarePassword:
          type: boolean
        ultimoAccesso:
          type: ["string", "null"]
        creatoIl:
          type: string
    CollaboratoreDettaglio:
      allOf:
        - $ref: "#/components/schemas/Collaboratore"
        - type: object
          required: [membri]
          properties:
            membri:
              type: array
              description: Collaboratori che appartengono al gruppo (vuoto se non e' capogruppo)
              items:
                $ref: "#/components/schemas/CollaboratoreRiepilogo"
    CollaboratoreInput:
      type: object
      required:
        - nome
        - cognome
        - sesso
        - dataNascita
        - luogoNascitaCodice
        - nazionalita
        - codiceFiscale
        - email
        - cellulare
        - numeroSportello
        - tipologia
        - passwordProvvisoria
      properties:
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        sesso:
          $ref: "#/components/schemas/Sesso"
        dataNascita:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        luogoNascitaCodice:
          type: string
          description: Codice del comune o dello stato scelto con la ricerca luoghi
        nazionalita:
          type: string
          description: Codice restituito da listNazionalita
        codiceFiscale:
          type: string
          minLength: 16
          maxLength: 16
        email:
          type: string
        telefono:
          type: ["string", "null"]
        cellulare:
          type: string
        numeroSportello:
          type: string
          minLength: 1
        tipologia:
          $ref: "#/components/schemas/Tipologia"
        capogruppoId:
          type: ["integer", "null"]
        passwordProvvisoria:
          type: string
          minLength: 8
    CollaboratoreUpdate:
      type: object
      required:
        - nome
        - cognome
        - sesso
        - dataNascita
        - luogoNascitaCodice
        - nazionalita
        - codiceFiscale
        - email
        - cellulare
        - numeroSportello
        - tipologia
        - attivo
      properties:
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        sesso:
          $ref: "#/components/schemas/Sesso"
        dataNascita:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        luogoNascitaCodice:
          type: string
        nazionalita:
          type: string
        codiceFiscale:
          type: string
          minLength: 16
          maxLength: 16
        email:
          type: string
        telefono:
          type: ["string", "null"]
        cellulare:
          type: string
        numeroSportello:
          type: string
          minLength: 1
        tipologia:
          $ref: "#/components/schemas/Tipologia"
        capogruppoId:
          type: ["integer", "null"]
        attivo:
          type: boolean

    AssistitoInput:
      type: object
      required:
        - nome
        - cognome
        - sesso
        - dataNascita
        - luogoNascitaCodice
        - nazionalita
        - codiceFiscale
        - cellulare
        - citta
      properties:
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        sesso:
          $ref: "#/components/schemas/Sesso"
        dataNascita:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        luogoNascitaCodice:
          type: string
          description: Codice del comune o dello stato scelto con la ricerca luoghi
        nazionalita:
          type: string
          description: Codice restituito da listNazionalita
        codiceFiscale:
